<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Заказ Завтрака | Barin Residence</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #121214;
      --card-bg: #1a1a1e;
      --accent: #d4af37;
      --accent-hover: #b8972c;
      --text: #ffffff;
      --text-muted: #8e8e93;
      --border: #2c2c30;
      --success: #34c759;
    }
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Montserrat', sans-serif; 
      -webkit-tap-highlight-color: transparent; 
    }
    body { 
      background: var(--bg); 
      color: var(--text); 
      min-height: 100vh; 
      padding: 20px 14px 120px; 
    }
    .container { 
      max-width: 800px; 
      margin: 0 auto; 
    }
    header { 
      text-align: center; 
      margin-bottom: 24px; 
    }
    header h1 { 
      font-size: 22px; 
      font-weight: 700; 
      color: var(--accent); 
      letter-spacing: 1px; 
      text-transform: uppercase; 
    }
    header p { 
      color: var(--text-muted); 
      font-size: 13px; 
      margin-top: 6px; 
      line-height: 1.4;
    }

    .card-section { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 16px; 
      padding: 18px 16px; 
      margin-bottom: 20px; 
    }
    .section-title { 
      font-size: 16px; 
      font-weight: 600; 
      margin-bottom: 14px; 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      color: var(--accent); 
    }
    
    .form-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); 
      gap: 14px; 
    }
    .form-group label { 
      display: block; 
      font-size: 12px; 
      color: var(--text-muted); 
      margin-bottom: 6px; 
    }
    .form-group input, .form-group select, .form-group textarea {
      width: 100%; 
      background: #242428; 
      border: 1px solid var(--border); 
      border-radius: 10px; 
      color: #fff; 
      padding: 12px 14px; 
      font-size: 14px; 
      outline: none; 
      transition: 0.2s; 
      -webkit-appearance: none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { 
      border-color: var(--accent); 
    }

    .guest-tab { 
      border-left: 3px solid var(--accent); 
      padding-left: 14px; 
      margin-bottom: 20px; 
    }
    .guest-title { 
      font-size: 16px; 
      font-weight: 600; 
      margin-bottom: 12px; 
    }

    .dish-category-label {
      font-size: 13px; 
      color: var(--accent); 
      font-weight: 600; 
      display: block; 
      margin-bottom: 10px; 
    }

    .menu-grid { 
      display: grid; 
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); 
      gap: 12px; 
      margin-bottom: 16px; 
    }
    .dish-card { 
      background: #242428; 
      border: 2px solid transparent; 
      border-radius: 12px; 
      overflow: hidden; 
      cursor: pointer; 
      transition: 0.2s; 
      display: flex; 
      flex-direction: column; 
      min-height: 180px;
    }
    .dish-card.selected { 
      border-color: var(--accent); 
      background: #2c2920; 
    }
    .dish-img { 
      width: 100%; 
      height: 100px; 
      object-fit: cover; 
      background: #2c2c30; 
      display: block;
    }
    .dish-info { 
      padding: 10px; 
      flex: 1; 
      display: flex; 
      flex-direction: column; 
      justify-content: space-between; 
    }
    .dish-name { 
      font-size: 13px; 
      font-weight: 600; 
      margin-bottom: 4px; 
      line-height: 1.3; 
    }
    .dish-desc { 
      font-size: 11px; 
      color: var(--text-muted); 
      line-height: 1.2;
    }

    .modifiers { 
      margin-top: 8px; 
      padding-top: 8px; 
      border-top: 1px solid var(--border); 
      display: flex; 
      flex-wrap: wrap; 
      gap: 6px; 
    }
    .mod-chip { 
      font-size: 11px; 
      padding: 6px 10px; 
      background: #1a1a1e; 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      cursor: pointer; 
      user-select: none; 
      transition: 0.15s; 
    }
    .mod-chip.active { 
      background: var(--accent); 
      color: #000; 
      border-color: var(--accent); 
      font-weight: 600; 
    }

    .footer-bar {
      position: fixed; 
      bottom: 0; 
      left: 0; 
      right: 0; 
      background: rgba(26, 26, 30, 0.95); 
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid var(--border); 
      padding: 14px 18px; 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      z-index: 100; 
    }
    .submit-btn {
      background: var(--accent); 
      color: #000; 
      border: none; 
      border-radius: 10px; 
      padding: 14px 24px; 
      font-size: 15px; 
      font-weight: 700; 
      cursor: pointer; 
      transition: 0.2s; 
    }
    .submit-btn:disabled { 
      background: #444; 
      color: #777; 
      cursor: not-allowed; 
    }

    .modal { 
      position: fixed; 
      inset: 0; 
      background: rgba(0,0,0,0.85); 
      display: none; 
      align-items: center; 
      justify-content: center; 
      z-index: 200; 
      padding: 20px; 
    }
    .modal-content { 
      background: var(--card-bg); 
      border: 1px solid var(--border); 
      border-radius: 20px; 
      padding: 28px 20px; 
      text-align: center; 
      max-width: 360px; 
      width: 100%; 
    }
    .modal-content h2 { 
      color: var(--success); 
      margin-bottom: 10px; 
      font-size: 20px;
    }
    .modal-btn { 
      margin-top: 18px; 
      background: #333; 
      color: #fff; 
      border: none; 
      padding: 12px 20px; 
      border-radius: 10px; 
      font-weight: 600; 
      cursor: pointer; 
      width: 100%; 
    }
  </style>
</head>
<body>

<div class="container">
  <header>
    <h1>Barin Residence</h1>
    <p>Заказ завтрака • Подача 8:00 – 10:45 (до 22:00 накануне)</p>
  </header>

  <div class="card-section">
    <div class="section-title">📍 Детали подачи</div>
    <div class="form-grid">
      <div class="form-group">
        <label>Номер комнаты *</label>
        <input type="text" id="roomNumber" placeholder="Например: 33" required>
      </div>
      <div class="form-group">
        <label>Количество персон</label>
        <select id="guestsCount" onchange="renderGuests()">
          <option value="1">1 гость</option>
          <option value="2">2 гостя</option>
          <option value="3">3 гостя</option>
          <option value="4">4 гостя</option>
          <option value="5">5 гостей</option>
        </select>
      </div>
      <div class="form-group">
        <label>Место подачи *</label>
        <select id="deliveryPlace">
          <option value="Кафе">Кафе (9 этаж)</option>
          <option value="В номер">В номер</option>
        </select>
      </div>
      <div class="form-group">
        <label>Желаемое время подачи *</label>
        <select id="deliveryTime">
          <option value="8:00:00">8:00</option>
          <option value="8:15:00">8:15</option>
          <option value="8:30:00">8:30</option>
          <option value="8:45:00">8:45</option>
          <option value="9:00:00">9:00</option>
          <option value="9:15:00">9:15</option>
          <option value="9:30:00">9:30</option>
          <option value="9:45:00">9:45</option>
          <option value="10:00:00">10:00</option>
          <option value="10:15:00">10:15</option>
          <option value="10:30:00">10:30</option>
          <option value="10:45:00">10:45</option>
        </select>
      </div>
    </div>
  </div>

  <div id="guestsContainer"></div>

  <div class="card-section">
    <div class="section-title">💬 Особые пожелания или аллергии</div>
    <div class="form-group">
      <textarea id="comment" rows="2" placeholder="Укажите аллергии или комментарии к заказу..."></textarea>
    </div>
  </div>
</div>

<div class="footer-bar">
  <div style="font-size: 12px; color: var(--text-muted);">
    Выберите блюда для гостей
  </div>
  <button class="submit-btn" id="submitBtn" onclick="submitOrder()">Оформить заказ</button>
</div>

<div class="modal" id="successModal">
  <div class="modal-content">
    <h2>✓ Заказ принят!</h2>
    <p style="color: var(--text-muted); font-size: 13px; margin-top: 8px;">Данные переданы на кухню. Ждем вас на завтрак!</p>
    <button class="modal-btn" onclick="resetForm()">Сделать еще заказ</button>
  </div>
</div>

<script>
  const SHEETDB_URL = "https://sheetdb.io/api/v1/901k3dvjxe9zn";

  const MAIN_DISHES = [
    { id: "omlet", name: "Омлет из двух яиц с добавками", desc: "Нежный омлет с топпингами", img: "https://images.unsplash.com/photo-1586190848861-99aa4a171e90?w=400&auto=format&fit=crop", mods: ["Ветчина", "Сыр", "Помидор"] },
    { id: "glazunya", name: "Глазунья из двух яиц с добавками", desc: "Яичница из двух яиц", img: "https://images.unsplash.com/photo-1525351484163-7529414344d8?w=400&auto=format&fit=crop", mods: ["Ветчина", "Сыр", "Помидор"] },
    { id: "brioche", name: "Злаковая бриошь с беконом, жареным яйцом, с", desc: "С салатом и сыром Чеддер", img: "https://images.unsplash.com/photo-1550547660-d9450f859349?w=400&auto=format&fit=crop", mods: [] },
    { id: "croissant_salmon", name: "Круассан с яйцом пашот, слабосоленой семгой", desc: "Свежая выпечка и семга", img: "https://images.unsplash.com/photo-1555396273-367ea4eb4db5?w=400&auto=format&fit=crop", mods: [] },
    { id: "croissant_nutella", name: "Круассан с нутеллой", desc: "Сладкий круассан", img: "https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=400&auto=format&fit=crop", mods: [] },
    { id: "croissant_tomato", name: "Круассан с томатом и помидором", desc: "Легкий круассан", img: "https://images.unsplash.com/photo-1530610476181-d83430b64dcd?w=400&auto=format&fit=crop", mods: [] },
    { id: "syrniki", name: "Сырники с ягодами, вареньем и сметаной", desc: "Классические сырники", img: "https://images.unsplash.com/photo-1584776296944-ab6fb57b0bdd?w=400&auto=format&fit=crop", mods: [] },
    { id: "blini_tvorog", name: "Блины с творогом", desc: "Сладкие блинчики", img: "https://images.unsplash.com/photo-1519676867240-f03562e64548?w=400&auto=format&fit=crop", mods: [] },
    { id: "blini_banana_choc", name: "Блины с бананом и шоколадом", desc: "Десертные блины", img: "https://images.unsplash.com/photo-1506084868230-bb9d95c24759?w=400&auto=format&fit=crop", mods: [] },
    { id: "blini_salmon", name: "Блины с лососем и сливочным сыром", desc: "Сытные блины с рыбой", img: "https://images.unsplash.com/photo-1534422298391-e4f8c172dddb?w=400&auto=format&fit=crop", mods: [] },
    { id: "caesar_sandwich", name: 'Сендвич "Цезарь" с куриным филе гриль', desc: "С фирменным соусом", img: "https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=400&auto=format&fit=crop", mods: [] }
  ];

  const EXTRA_DISHES = [
    { id: "oatmeal", name: "Овсяная каша", desc: "Выберите основу и добавки", img: "https://images.unsplash.com/photo-1517673132405-a56a62b18caf?w=400&auto=format&fit=crop", bases: ["На молоке", "На воде", "На молоке (БЕЗ САХАРА)"], mods: ["Фрукты", "Орехи"] },
    { id: "rice_porridge", name: "Рисовая каша", desc: "Выберите основу и добавки", img: "https://images.unsplash.com/photo-1536304993881-ff6e9eefa2a6?w=400&auto=format&fit=crop", bases: ["На молоке", "На воде", "На молоке (БЕЗ САХАРА)"], mods: ["Фрукты", "Орехи"] }
  ];

  let orderData = [];

  function renderGuests() {
    const count = parseInt(document.getElementById('guestsCount').value);
    const container = document.getElementById('guestsContainer');
    if (!container) return;
    container.innerHTML = '';
    orderData = [];

    for (let i = 0; i < count; i++) {
      orderData.push({ mainDish: null, mainModifiers: [], extraDish: null, extraBase: "", extraModifiers: [], drink: "" });

      const section = document.createElement('div');
      section.className = 'card-section guest-tab';
      section.innerHTML = `
        <div class="guest-title">👤 Гость №${i + 1}</div>
        
        <label class="dish-category-label">1. ОСНОВНОЕ БЛЮДО (опционально):</label>
        <div class="menu-grid" id="main-grid-${i}">
          ${MAIN_DISHES.map(d => renderMainCard(d, i)).join('')}
        </div>

        <label class="dish-category-label" style="margin-top: 18px;">2. ДОПОЛНИТЕЛЬНОЕ БЛЮДО (КАША - опционально):</label>
        <div class="menu-grid" id="extra-grid-${i}">
          ${EXTRA_DISHES.map(d => renderExtraCard(d, i)).join('')}
        </div>

        <div class="form-group" style="margin-top: 14px;">
          <label>Напиток для Гостя №${i + 1} (сок, кофе, чай):</label>
          <input type="text" placeholder="Например: Яблочный сок / Латте" oninput="orderData[${i}].drink = this.value">
        </div>
      `;
      container.appendChild(section);
    }
  }

  function renderMainCard(dish, guestIdx) {
    return `
      <div class="dish-card" id="main-${guestIdx}-${dish.id}" onclick="toggleMainDish(${guestIdx}, '${dish.id}', '${dish.name}')">
        <img src="${dish.img}" class="dish-img" alt="${dish.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="dish-info">
          <div>
            <div class="dish-name">${dish.name}</div>
            <div class="dish-desc">${dish.desc}</div>
          </div>
          ${dish.mods.length > 0 ? `
            <div class="modifiers" onclick="event.stopPropagation()">
              ${dish.mods.map(m => `<div class="mod-chip" onclick="toggleMainMod(${guestIdx}, '${m}', this)">+ ${m}</div>`).join('')}
            </div>
          ` : ''}
        </div>
      </div>
    `;
  }

  function renderExtraCard(dish, guestIdx) {
    return `
      <div class="dish-card" id="extra-${guestIdx}-${dish.id}" onclick="toggleExtraDish(${guestIdx}, '${dish.id}', '${dish.name}')">
        <img src="${dish.img}" class="dish-img" alt="${dish.name}" loading="lazy" onerror="this.style.display='none'">
        <div class="dish-info">
          <div>
            <div class="dish-name">${dish.name}</div>
            <div class="dish-desc">${dish.desc}</div>
          </div>
          <div class="modifiers" onclick="event.stopPropagation()">
            ${dish.bases.map((b, bIdx) => `<div class="mod-chip base-chip-${guestIdx} ${bIdx === 0 ? 'active' : ''}" onclick="selectBase(${guestIdx}, '${dish.id}', '${b}', this)">${b}</div>`).join('')}
          </div>
          <div class="modifiers" style="margin-top:4px; padding-top:4px; border:none;" onclick="event.stopPropagation()">
            ${dish.mods.map(m => `<div class="mod-chip extra-mod-chip-${guestIdx}" onclick="toggleExtraMod(${guestIdx}, '${dish.id}', '${m}', this)">+ ${m}</div>`).join('')}
          </div>
        </div>
      </div>
    `;
  }

  function toggleMainDish(guestIdx, dishId, dishName) {
    const cardEl = document.getElementById(`main-${guestIdx}-${dishId}`);
    if (orderData[guestIdx].mainDish === dishName) {
      orderData[guestIdx].mainDish = null;
      orderData[guestIdx].mainModifiers = [];
      cardEl.classList.remove('selected');
      cardEl.querySelectorAll('.mod-chip').forEach(c => c.classList.remove('active'));
      return;
    }

    orderData[guestIdx].mainDish = dishName;
    orderData[guestIdx].mainModifiers = [];
    MAIN_DISHES.forEach(d => {
      const el = document.getElementById(`main-${guestIdx}-${d.id}`);
      if (el) {
        el.classList.remove('selected');
        el.querySelectorAll('.mod-chip').forEach(c => c.classList.remove('active'));
      }
    });
    cardEl.classList.add('selected');
  }

  function toggleMainMod(guestIdx, modName, el) {
    const parent = el.closest('.dish-card');
    if (!parent.classList.contains('selected')) {
      const dish = MAIN_DISHES.find(d => parent.id.includes(d.id));
      toggleMainDish(guestIdx, dish.id, dish.name);
    }

    const mods = orderData[guestIdx].mainModifiers;
    const idx = mods.indexOf(modName);
    if (idx > -1) {
      mods.splice(idx, 1);
      el.classList.remove('active');
    } else {
      mods.push(modName);
      el.classList.add('active');
    }
  }

  function toggleExtraDish(guestIdx, dishId, dishName) {
    const cardEl = document.getElementById(`extra-${guestIdx}-${dishId}`);
    
    if (orderData[guestIdx].extraDish === dishName) {
      orderData[guestIdx].extraDish = null;
      orderData[guestIdx].extraBase = "";
      orderData[guestIdx].extraModifiers = [];
      cardEl.classList.remove('selected');
      cardEl.querySelectorAll('.mod-chip').forEach(c => c.classList.remove('active'));
      return;
    }

    orderData[guestIdx].extraDish = dishName;
    if (!orderData[guestIdx].extraBase) {
      orderData[guestIdx].extraBase = "На молоке";
    }

    EXTRA_DISHES.forEach(d => {
      const el = document.getElementById(`extra-${guestIdx}-${d.id}`);
      if (el && d.id !== dishId) {
        el.classList.remove('selected');
        el.querySelectorAll('.mod-chip').forEach(c => c.classList.remove('active'));
      }
    });

    cardEl.classList.add('selected');
    
    const activeBase = cardEl.querySelector(`.base-chip-${guestIdx}.active`);
    if (!activeBase) {
      const firstBase = cardEl.querySelector(`.base-chip-${guestIdx}`);
      if (firstBase) firstBase.classList.add('active');
    }
  }

  function selectBase(guestIdx, dishId, baseName, el) {
    const dish = EXTRA_DISHES.find(d => d.id === dishId);
    const cardEl = document.getElementById(`extra-${guestIdx}-${dishId}`);

    if (orderData[guestIdx].extraDish !== dish.name) {
      toggleExtraDish(guestIdx, dishId, dish.name);
    }

    orderData[guestIdx].extraBase = baseName;
    cardEl.querySelectorAll(`.base-chip-${guestIdx}`).forEach(c => c.classList.remove('active'));
    el.classList.add('active');
  }

  function toggleExtraMod(guestIdx, dishId, modName, el) {
    const dish = EXTRA_DISHES.find(d => d.id === dishId);
    
    if (orderData[guestIdx].extraDish !== dish.name) {
      toggleExtraDish(guestIdx, dishId, dish.name);
    }

    if (!orderData[guestIdx].extraModifiers) {
      orderData[guestIdx].extraModifiers = [];
    }

    const mods = orderData[guestIdx].extraModifiers;
    const idx = mods.indexOf(modName);

    if (idx > -1) {
      mods.splice(idx, 1);
      el.classList.remove('active');
    } else {
      mods.push(modName);
      el.classList.add('active');
    }
  }

  async function submitOrder() {
    const room = document.getElementById('roomNumber').value.trim();
    if (!room) {
      alert('Пожалуйста, укажите номер комнаты!');
      return;
    }

    for (let i = 0; i < orderData.length; i++) {
      if (!orderData[i].mainDish && !orderData[i].extraDish) {
        alert(`Пожалуйста, выберите хотя бы одно блюдо для Гостя №${i + 1}`);
        return;
      }
    }

    const btn = document.getElementById('submitBtn');
    btn.disabled = true;
    btn.innerText = "Отправка...";

    const place = document.getElementById('deliveryPlace').value;
    const time = document.getElementById('deliveryTime').value;
    const generalComment = document.getElementById('comment').value.trim();

    const rows = orderData.map(g => {
      const extraModsStr = (g.extraModifiers && g.extraModifiers.length > 0)
        ? g.extraModifiers.join(', ')
        : "";

      return {
        "room": room,
        "time": time,
        "place": place,
        "main": g.mainDish || "",
        "main_mods": (g.mainModifiers && g.mainModifiers.length > 0) ? g.mainModifiers.join(', ') : "",
        "extra": g.extraDish || "",
        "extra_base": g.extraDish ? (g.extraBase || "На молоке") : "",
        "extra_mods": extraModsStr,
        "comment": g.drink ? (generalComment ? `${g.drink} (${generalComment})` : g.drink) : generalComment
      };
    });

    try {
      const response = await fetch(SHEETDB_URL, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify({ data: rows })
      });

      if (response.ok) {
        document.getElementById('successModal').style.display = 'flex';
      } else {
        const errJson = await response.json();
        alert("Ошибка SheetDB: " + JSON.stringify(errJson));
      }
    } catch(e) {
      alert("Сетевая ошибка: " + e);
    } finally {
      btn.disabled = false;
      btn.innerText = "Оформить заказ";
    }
  }

  function resetForm() {
    document.getElementById('roomNumber').value = '';
    document.getElementById('comment').value = '';
    document.getElementById('successModal').style.display = 'none';
    renderGuests();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', renderGuests);
  } else {
    renderGuests();
  }
</script>
</body>
</html>
